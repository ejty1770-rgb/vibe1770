<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>테트리스</title>
  <style>
    :root {
      --bg: #111;
      --board: #222;
      --grid: rgba(255,255,255,0.08);
      --tile-border: rgba(255,255,255,0.12);
      --text: #f8f8f8;
      --accent: #e67e22;
      --accent-2: #3498db;
      --panel: rgba(255,255,255,0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #333 0%, #0a0a0a 45%);
      color: var(--text);
      padding: 20px;
    }

    .container {
      display: grid;
      grid-template-columns: 320px 260px;
      gap: 24px;
      width: min(100%, 720px);
    }

    .board-card,
    .info-card {
      border-radius: 20px;
      background: var(--board);
      box-shadow: 0 30px 60px rgba(0,0,0,0.35);
      overflow: hidden;
    }

    .board-card {
      padding: 24px;
      display: grid;
      place-items: center;
    }

    canvas {
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      border-radius: 16px;
      background: #111;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    }

    .info-card {
      padding: 24px;
      display: grid;
      gap: 18px;
    }

    h1 {
      font-size: 1.8rem;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .stats {
      display: grid;
      gap: 12px;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 16px;
      background: var(--panel);
    }

    .stat-row span {
      opacity: 0.8;
      font-size: 0.95rem;
    }

    .stat-value {
      font-weight: 700;
      font-size: 1.15rem;
    }

    .next-piece {
      border-radius: 16px;
      padding: 18px;
      background: var(--panel);
      display: grid;
      gap: 14px;
    }

    .next-piece canvas {
      width: 100%;
      height: 200px;
      border-radius: 14px;
      background: #111;
    }

    .instructions {
      display: grid;
      gap: 10px;
      padding: 18px 16px;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .instructions strong {
      color: var(--accent);
    }

    .button-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 0.95rem;
      cursor: pointer;
      color: var(--text);
      background: radial-gradient(circle at top left, #f39c12 0%, #d35400 100%);
      box-shadow: 0 10px 20px rgba(0,0,0,0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 23px rgba(0,0,0,0.32);
    }

    button:active {
      transform: translateY(0);
    }

    .footer {
      margin-top: 12px;
      font-size: 0.9rem;
      opacity: 0.75;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="board-card">
      <canvas id="tetris" width="240" height="480"></canvas>
    </section>

    <section class="info-card">
      <div>
        <h1>테트리스</h1>
        <p>방향키로 조작하세요. 스페이스바로 빠르게 떨어뜨립니다.</p>
      </div>

      <div class="stats">
        <div class="stat-row"><span>점수</span><span id="score">0</span></div>
        <div class="stat-row"><span>레벨</span><span id="level">0</span></div>
        <div class="stat-row"><span>라인</span><span id="lines">0</span></div>
      </div>

      <div class="next-piece">
        <span>다음 블록</span>
        <canvas id="next" width="120" height="120"></canvas>
      </div>

      <div class="button-row">
        <button id="startBtn">시작</button>
        <button id="pauseBtn">일시정지</button>
      </div>

      <div class="instructions">
        <p><strong>왼쪽/오른쪽</strong> : 이동</p>
        <p><strong>위</strong> : 회전</p>
        <p><strong>아래</strong> : 천천히 떨어뜨리기</p>
        <p><strong>스페이스</strong> : 즉시 떨어뜨리기</p>
      </div>

      <div class="footer">게임 오버 시 다시 시작 버튼을 눌러주세요.</div>
    </section>
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20);

    const nextCanvas = document.getElementById('next');
    const nextCtx = nextCanvas.getContext('2d');
    nextCtx.scale(20, 20);

    const scoreElement = document.getElementById('score');
    const levelElement = document.getElementById('level');
    const linesElement = document.getElementById('lines');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    const arena = createMatrix(12, 24);
    const colors = [
      null,
      '#00d4ff',
      '#ffcb00',
      '#ff6200',
      '#9b59b6',
      '#2ecc71',
      '#e74c3c',
      '#3498db'
    ];

    const pieces = 'ILJOTSZ';
    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;
    let paused = false;
    let gameOver = false;
    let level = 0;
    let lines = 0;
    let score = 0;

    const player = {
      pos: {x: 0, y: 0},
      matrix: null,
      next: null,
      score: 0,
      level: 0,
      lines: 0
    };

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    function createPiece(type) {
      switch (type) {
        case 'T': return [
          [0, 0, 0],
          [1, 1, 1],
          [0, 1, 0],
        ];
        case 'O': return [
          [2, 2],
          [2, 2],
        ];
        case 'L': return [
          [0, 3, 0],
          [0, 3, 0],
          [0, 3, 3],
        ];
        case 'J': return [
          [0, 4, 0],
          [0, 4, 0],
          [4, 4, 0],
        ];
        case 'I': return [
          [0, 5, 0, 0],
          [0, 5, 0, 0],
          [0, 5, 0, 0],
          [0, 5, 0, 0],
        ];
        case 'S': return [
          [0, 6, 6],
          [6, 6, 0],
          [0, 0, 0],
        ];
        case 'Z': return [
          [7, 7, 0],
          [0, 7, 7],
          [0, 0, 0],
        ];
      }
    }

    function collide(arena, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
            (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
      }
      dropCounter = 0;
    }

    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(arena, player)) {
        player.pos.x -= dir;
      }
    }

    function playerReset() {
      if (!player.next) {
        player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
      }
      player.matrix = player.next;
      player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

      if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        score = 0;
        lines = 0;
        level = 0;
        updateScore();
        gameOver = true;
      }
    }

    function arenaSweep() {
      let rowCount = 0;
      outer: for (let y = arena.length - 1; y >= 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }

        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;

        rowCount++;
      }
      if (rowCount > 0) {
        lines += rowCount;
        score += rowCount * 100 * rowCount;
        level = Math.floor(lines / 10);
        dropInterval = Math.max(100, 1000 - level * 100);
      }
    }

    function drawMatrix(matrix, offset, ctx) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            ctx.fillStyle = colors[value];
            ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
            ctx.strokeStyle = 'rgba(255,255,255,0.18)';
            ctx.lineWidth = 0.08;
            ctx.strokeRect(x + offset.x + 0.02, y + offset.y + 0.02, 0.96, 0.96);
          }
        });
      });
    }

    function draw() {
      context.fillStyle = '#111';
      context.fillRect(0, 0, canvas.width, canvas.height);

      drawMatrix(arena, {x: 0, y: 0}, context);
      drawMatrix(player.matrix, player.pos, context);
    }

    function drawNext() {
      nextCtx.fillStyle = '#111';
      nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (player.next) {
        const offset = {
          x: (nextCanvas.width / 20 - player.next[0].length) / 2,
          y: (nextCanvas.height / 20 - player.next.length) / 2
        };
        drawMatrix(player.next, offset, nextCtx);
      }
    }

    function updateScore() {
      scoreElement.textContent = score;
      levelElement.textContent = level;
      linesElement.textContent = lines;
    }

    function update(time = 0) {
      if (paused || gameOver) {
        lastTime = time;
        requestAnimationFrame(update);
        return;
      }

      const deltaTime = time - lastTime;
      lastTime = time;
      dropCounter += deltaTime;

      if (dropCounter > dropInterval) {
        playerDrop();
      }

      draw();
      drawNext();
      requestAnimationFrame(update);
    }

    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    document.addEventListener('keydown', event => {
      if (gameOver) return;
      if (event.key === 'ArrowLeft') {
        playerMove(-1);
      } else if (event.key === 'ArrowRight') {
        playerMove(1);
      } else if (event.key === 'ArrowDown') {
        playerDrop();
      } else if (event.key === 'ArrowUp') {
        playerRotate(1);
      } else if (event.code === 'Space') {
        event.preventDefault();
        while (!collide(arena, player)) {
          player.pos.y++;
        }
        player.pos.y--;
        playerDrop();
      } else if (event.key === 'p' || event.key === 'P') {
        togglePause();
      }
    });

    startBtn.addEventListener('click', () => {
      gameOver = false;
      paused = false;
      arena.forEach(row => row.fill(0));
      score = 0;
      lines = 0;
      level = 0;
      dropInterval = 1000;
      player.next = null;
      playerReset();
      updateScore();
      update();
    });

    pauseBtn.addEventListener('click', togglePause);

    function togglePause() {
      if (gameOver) return;
      paused = !paused;
      pauseBtn.textContent = paused ? '계속' : '일시정지';
    }

    // initialize
    player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
    playerReset();
    updateScore();
    draw();
    drawNext();
  </script>
</body>
</html>
